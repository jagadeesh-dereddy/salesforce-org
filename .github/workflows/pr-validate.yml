name: Validate Deployment (PR gate)

# Runs as the merge gate for every promotion PR in the pipeline:
#   feature/* -> dev -> qa -> uat -> release -> master
# Each target branch maps to one Salesforce environment/org. This workflow
# never deploys - it only runs `sf project deploy validate` (a server-side
# dry run) so a bad PR is caught before merge, with zero risk to the org.

on:
  pull_request:
    branches: [ dev, qa, uat, release, master ]
    paths:
      - 'force-app/**'
      - 'manifest/**'

# Least-privilege default: this workflow only reads the repo and calls out
# to Salesforce; it never needs to write back to GitHub.
permissions:
  contents: read

# Superseding stale runs on new pushes to the same PR avoids wasting a
# validate slot against the org and avoids two runs racing for the same
# environment.
concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SF_USE_GENERIC_UNIX_KEYCHAIN: true
  SF_DOMAIN_RETRY: 300
  # GitHub-hosted runners prefer IPv6 DNS resolution, which can hang/fail
  # when calling Salesforce's API endpoints via Node's fetch. Force IPv4.
  NODE_OPTIONS: --dns-result-order=ipv4first
  SF_DISABLE_APP_HUB: true
  SF_LOG_LEVEL: WARN

jobs:
  # Resolves which Salesforce environment (and therefore which GitHub
  # Environment / secret set) this PR's target branch corresponds to.
  # Keeping this as its own job means the mapping is defined once, and the
  # `validate` job's `environment:` can be set dynamically from its output.
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - name: Map target branch to Salesforce environment
        id: map
        run: |
          set -euo pipefail
          case "${{ github.base_ref }}" in
            dev)     ENVIRONMENT="dev" ;;
            qa)      ENVIRONMENT="qa" ;;
            uat)     ENVIRONMENT="uat" ;;
            release) ENVIRONMENT="production" ;;
            master)  ENVIRONMENT="production" ;;
            *)
              echo "::error::No environment mapping defined for base branch '${{ github.base_ref }}'"
              exit 1
              ;;
          esac
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "PR into '${{ github.base_ref }}' -> validating against the '$ENVIRONMENT' org"

  validate:
    needs: determine-environment
    # Selecting the GitHub Environment here means this job automatically
    # picks up that environment's own SF_CLIENT_ID / SF_USERNAME /
    # SF_INSTANCE_URL / SF_JWT_KEY secrets (same names, different values
    # per environment) and any protection rules configured on it (e.g.
    # required reviewers before touching the production/UAT org).
    environment: ${{ needs.determine-environment.outputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          # We only ever read the checkout; don't leave a push-capable
          # git credential lying around on the runner.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: |
          set -euo pipefail
          # Pinned deliberately: silent auto-upgrades of the CLI are a
          # supply-chain risk and have broken this pipeline before (flag
          # renames between versions). Bump intentionally, via PR review.
          npm install -g @salesforce/cli@2.146.3
          sf --version

      - name: Install SFDX Git Delta plugin
        run: |
          set -euo pipefail

          # sfdx-git-delta is a widely-used, third-party (non-Salesforce)
          # OSS plugin for computing a git-diff-based package.xml - not an
          # official Salesforce product. Since the version is pinned rather
          # than "latest" (see the CLI install step above for why), verify
          # the exact tarball we're about to install still matches its
          # published integrity hash before trusting it, as an explicit,
          # auditable supply-chain check independent of npm's own
          # resolution. Update this hash deliberately (via PR review) if
          # the pinned version above is ever bumped.
          EXPECTED_INTEGRITY="sha512-MpAp0VuOnM3QtQmnTm1DVnOI6FaLCR3B/xTbpv7b7W8WsBLb9JQZJUoI/zX8rc/Zi2lXQOFCcQQdWhZ5k9IeqA=="
          ACTUAL_INTEGRITY="sha512-$(curl -fsSL https://registry.npmjs.org/sfdx-git-delta/-/sfdx-git-delta-6.45.1.tgz | openssl dgst -sha512 -binary | base64)"
          if [ "$ACTUAL_INTEGRITY" != "$EXPECTED_INTEGRITY" ]; then
            echo "::error::sfdx-git-delta@6.45.1 tarball hash mismatch - expected $EXPECTED_INTEGRITY, got $ACTUAL_INTEGRITY. Refusing to install; this could indicate tampering."
            exit 1
          fi

          echo y | sf plugins install sfdx-git-delta@6.45.1

      - name: Authenticate to Salesforce (JWT bearer flow)
        run: |
          set -euo pipefail
          # Write, decrypt (if needed), and consume the key in the same
          # step, back to back, so there's no window between steps where a
          # concurrent job on a shared self-hosted runner could clear
          # $RUNNER_TEMP out from under this one (GitHub only guarantees a
          # clean $RUNNER_TEMP at the *start* of a job on self-hosted
          # runners - it does not guarantee exclusive use of it for the
          # job's full duration if the runner picks up an overlapping job).
          umask 077
          RAW_KEY_FILE="$(mktemp "$RUNNER_TEMP/jwt-key-raw.XXXXXX")"
          JWT_KEY_FILE="$(mktemp "$RUNNER_TEMP/jwt-key.XXXXXX")"
          trap 'rm -f "$RAW_KEY_FILE" "$JWT_KEY_FILE"' EXIT
          printf '%s' "${{ secrets.SF_JWT_KEY }}" > "$RAW_KEY_FILE"

          # Decrypts a passphrase-protected key (e.g. exported from an
          # enterprise CA/cert manager like Venafi) into a plain key the CLI
          # can use. Safe to run unconditionally, even when SF_JWT_KEY is
          # already unencrypted: openssl silently ignores -passin when the
          # input key doesn't need it, so this is a no-op pass-through for
          # environments whose key was never encrypted in the first place.
          # (-passin env:... avoids the passphrase ever appearing as a
          # command-line argument, where it would be visible to other
          # processes on a shared runner via `ps`.)
          export SF_JWT_KEY_PASSPHRASE="${{ secrets.SF_JWT_KEY_PASSPHRASE }}"
          openssl pkey -in "$RAW_KEY_FILE" -passin env:SF_JWT_KEY_PASSPHRASE -out "$JWT_KEY_FILE"

          sf org login jwt \
            --client-id "${{ secrets.SF_CLIENT_ID }}" \
            --jwt-key-file "$JWT_KEY_FILE" \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias target-org \
            --set-default

          rm -f "$RAW_KEY_FILE" "$JWT_KEY_FILE"

      - name: Verify authentication and target org identity
        run: |
          set -euo pipefail
          ORG_INFO=$(sf org display --target-org target-org --json)
          ORG_ID=$(echo "$ORG_INFO" | jq -r '.result.id')
          echo "Authenticated to org: $ORG_ID"

          # Optional guardrail: if an environment defines SF_EXPECTED_ORG_ID,
          # refuse to continue on a mismatch. This catches the scenario
          # where a secret was pasted into the wrong GitHub Environment
          # (e.g. UAT credentials saved under Production) before anything
          # gets validated against the wrong org.
          if [ -n "${{ secrets.SF_EXPECTED_ORG_ID }}" ] && [ "$ORG_ID" != "${{ secrets.SF_EXPECTED_ORG_ID }}" ]; then
            echo "::error::Authenticated org ($ORG_ID) does not match SF_EXPECTED_ORG_ID configured for the '${{ needs.determine-environment.outputs.environment }}' environment. Refusing to continue - check for a secrets misconfiguration."
            exit 1
          fi

      - name: Generate delta package (PR head vs. target branch)
        run: |
          set -euo pipefail
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Generating delta package between origin/$BASE_BRANCH and $HEAD_SHA"
          mkdir -p delta

          sf sgd:source:delta \
            --to "$HEAD_SHA" \
            --from "origin/$BASE_BRANCH" \
            --output-dir delta \
            --generate-delta

          echo "Generated package.xml:"
          cat delta/package/package.xml 2>/dev/null || echo "No package.xml generated"

          # A delta with no <members> (e.g. only comments/formatting changed
          # in a way git-delta ignores) still produces a well-formed but
          # empty package.xml. Deploying/validating an empty package fails
          # against the Salesforce API, so treat it as "nothing to do".
          if [ ! -f "delta/package/package.xml" ] || ! grep -q "<members>" delta/package/package.xml; then
            echo "No metadata changes detected - nothing to validate"
            echo "SKIP_VALIDATION=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_VALIDATION=false" >> "$GITHUB_ENV"
          fi

      - name: Validate deployment (dry run, no deploy)
        if: env.SKIP_VALIDATION == 'false'
        run: |
          set -euo pipefail
          echo "Validating against '${{ needs.determine-environment.outputs.environment }}' (merge gate only - nothing is deployed)"

          # Every environment runs RunLocalTests here, not just uat/production:
          # `sf project deploy validate` (checkOnly) rejects NoTestRun outright
          # ("Expected --test-level=NoTestRun to be one of: RunAllTestsInOrg,
          # RunLocalTests, RunSpecifiedTests, RunRelevantTests") - Salesforce
          # doesn't consider a dry-run deployment with zero tests meaningful.
          # dev/qa skip tests on the real deploy instead (see
          # deploy-destination.yml), which is where NoTestRun is actually valid.
          if ! VALIDATION_RESULT=$(sf project deploy validate \
                --manifest delta/package/package.xml \
                --target-org target-org \
                --test-level RunLocalTests \
                --wait 30 \
                --json); then
            echo "$VALIDATION_RESULT" | jq . 2>/dev/null || echo "$VALIDATION_RESULT"
            echo "::error::Validation failed against '${{ needs.determine-environment.outputs.environment }}'"
            exit 1
          fi

          echo "$VALIDATION_RESULT" | jq .

      - name: Revoke Salesforce session and remove key material
        if: always()
        run: |
          sf org logout --target-org target-org --no-prompt || true
          # The auth step already removes its own key file (via trap and on
          # success); this is just a belt-and-braces sweep for anything left
          # behind by an interrupted run.
          rm -f "$RUNNER_TEMP"/jwt-key* 2>/dev/null || true
