name: Validate Deployment (PR gate)

on:
  pull_request:
    branches: [ OrgSource ]
    paths:
      - 'force-app/**'
      - 'manifest/**'

env:
  SF_USE_GENERIC_UNIX_KEYCHAIN: true
  SF_DOMAIN_RETRY: 300
  SF_DISABLE_APP_HUB: true
  SF_LOG_LEVEL: DEBUG

jobs:
  validate-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Install SFDX Git Delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Create JWT Key File
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > jwt-key.txt
          chmod 600 jwt-key.txt

      - name: Authenticate to Salesforce
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file jwt-key.txt \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url ${{ secrets.SF_INSTANCE_URL }} \
            --alias target-org \
            --set-default

      - name: Verify Authentication
        run: |
          sf org display --target-org target-org

      - name: Generate Delta Package
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Generating delta package between origin/$BASE_BRANCH and $HEAD_SHA"

          mkdir -p delta

          sf sgd:source:delta \
            --to $HEAD_SHA \
            --from origin/$BASE_BRANCH \
            --output-dir delta \
            --generate-delta

          echo "Generated package.xml:"
          if [ -f "delta/package/package.xml" ]; then
            cat delta/package/package.xml
          else
            echo "No package.xml generated"
          fi

          if [ ! -f "delta/package/package.xml" ] || [ ! -s "delta/package/package.xml" ]; then
            echo "No metadata changes detected"
            echo "SKIP_VALIDATION=true" >> $GITHUB_ENV
          else
            echo "SKIP_VALIDATION=false" >> $GITHUB_ENV
          fi

      - name: Validate Deployment (dry run, no deploy)
        if: env.SKIP_VALIDATION == 'false'
        run: |
          echo "Starting validation-only deployment (merge gate)..."

          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org target-org \
            --test-level RunLocalTests \
            --wait 30
