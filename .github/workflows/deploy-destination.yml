name: Deploy to Salesforce Environment

# Real deploys happen here, one per environment branch:
#   dev -> Dev org, qa -> QA/Integration org, uat -> UAT org, release -> Production org
# `master` is intentionally excluded: it only accumulates the released,
# already-deployed history after a release branch has shipped to
# Production - merging into it does not trigger another deploy.
#
# Deploying to `uat`/`production` should require a human approval: configure
# "Required reviewers" on the corresponding GitHub Environment (Settings ->
# Environments) so the job pauses for sign-off before it runs. This is not
# expressible in YAML - it must be configured on the Environment itself.

on:
  push:
    branches: [ dev, qa, uat, release ]
    paths:
      - 'force-app/**'
      - 'manifest/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (only needed for a manual run)'
        required: true
        type: choice
        options: [ dev, qa, uat, production ]
      from_ref:
        description: 'Git ref/SHA to diff from (defaults to the previous commit on this branch)'
        required: false
        type: string

permissions:
  contents: read

env:
  SF_USE_GENERIC_UNIX_KEYCHAIN: true
  SF_DOMAIN_RETRY: 300
  # GitHub-hosted runners prefer IPv6 DNS resolution, which can hang/fail
  # when calling Salesforce's API endpoints via Node's fetch. Force IPv4.
  NODE_OPTIONS: --dns-result-order=ipv4first
  SF_DISABLE_APP_HUB: true
  SF_LOG_LEVEL: WARN

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      test_level: ${{ steps.map.outputs.test_level }}
    steps:
      - name: Map branch to Salesforce environment
        id: map
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.environment }}" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              dev)     ENVIRONMENT="dev" ;;
              qa)      ENVIRONMENT="qa" ;;
              uat)     ENVIRONMENT="uat" ;;
              release) ENVIRONMENT="production" ;;
              *)
                echo "::error::No environment mapping defined for branch '${{ github.ref_name }}'"
                exit 1
                ;;
            esac
          fi

          # Apex tests are intentionally skipped for the dev/qa deploys to
          # keep that feedback loop fast; UAT and Production always run
          # local tests. (Salesforce disallows NoTestRun for Production
          # outright, so this would be a hard requirement there regardless.)
          case "$ENVIRONMENT" in
            dev|qa)         TEST_LEVEL="NoTestRun" ;;
            uat|production) TEST_LEVEL="RunLocalTests" ;;
          esac

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "test_level=$TEST_LEVEL" >> "$GITHUB_OUTPUT"
          echo "Deploying branch '${{ github.ref_name }}' -> '$ENVIRONMENT' with test level '$TEST_LEVEL'"

  deploy:
    needs: determine-environment
    # Picks up this environment's own secrets, and - critically - any
    # required-reviewer protection rule configured on it in GitHub Settings.
    # That reviewer gate is the actual production safety control; nothing
    # in this file can substitute for it.
    environment: ${{ needs.determine-environment.outputs.environment }}
    # One deploy at a time per environment, and never cancel one that's
    # already running mid-deploy - queue behind it instead.
    concurrency:
      group: deploy-${{ needs.determine-environment.outputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: |
          set -euo pipefail
          npm install -g @salesforce/cli@2.146.3
          sf --version

      - name: Install SFDX Git Delta plugin
        run: |
          set -euo pipefail

          # sfdx-git-delta is a widely-used, third-party (non-Salesforce)
          # OSS plugin for computing a git-diff-based package.xml - not an
          # official Salesforce product. Since the version is pinned rather
          # than "latest" (see the CLI install step above for why), verify
          # the exact tarball we're about to install still matches its
          # published integrity hash before trusting it, as an explicit,
          # auditable supply-chain check independent of npm's own
          # resolution. Update this hash deliberately (via PR review) if
          # the pinned version above is ever bumped.
          EXPECTED_INTEGRITY="sha512-MpAp0VuOnM3QtQmnTm1DVnOI6FaLCR3B/xTbpv7b7W8WsBLb9JQZJUoI/zX8rc/Zi2lXQOFCcQQdWhZ5k9IeqA=="
          ACTUAL_INTEGRITY="sha512-$(curl -fsSL https://registry.npmjs.org/sfdx-git-delta/-/sfdx-git-delta-6.45.1.tgz | openssl dgst -sha512 -binary | base64)"
          if [ "$ACTUAL_INTEGRITY" != "$EXPECTED_INTEGRITY" ]; then
            echo "::error::sfdx-git-delta@6.45.1 tarball hash mismatch - expected $EXPECTED_INTEGRITY, got $ACTUAL_INTEGRITY. Refusing to install; this could indicate tampering."
            exit 1
          fi

          echo y | sf plugins install sfdx-git-delta@6.45.1

      - name: Authenticate to Salesforce (JWT bearer flow)
        run: |
          set -euo pipefail
          # Write, decrypt (if needed), and consume the key in the same
          # step, back to back, so there's no window between steps where a
          # concurrent job on a shared self-hosted runner could clear
          # $RUNNER_TEMP out from under this one (GitHub only guarantees a
          # clean $RUNNER_TEMP at the *start* of a job on self-hosted
          # runners - it does not guarantee exclusive use of it for the
          # job's full duration if the runner picks up an overlapping job).
          umask 077
          RAW_KEY_FILE="$(mktemp "$RUNNER_TEMP/jwt-key-raw.XXXXXX")"
          JWT_KEY_FILE="$(mktemp "$RUNNER_TEMP/jwt-key.XXXXXX")"
          trap 'rm -f "$RAW_KEY_FILE" "$JWT_KEY_FILE"' EXIT
          printf '%s' "${{ secrets.SF_JWT_KEY }}" > "$RAW_KEY_FILE"

          # Decrypts a passphrase-protected key (e.g. exported from an
          # enterprise CA/cert manager like Venafi) into a plain key the CLI
          # can use. Safe to run unconditionally, even when SF_JWT_KEY is
          # already unencrypted: openssl silently ignores -passin when the
          # input key doesn't need it, so this is a no-op pass-through for
          # environments whose key was never encrypted in the first place.
          # (-passin env:... avoids the passphrase ever appearing as a
          # command-line argument, where it would be visible to other
          # processes on a shared runner via `ps`.)
          export SF_JWT_KEY_PASSPHRASE="${{ secrets.SF_JWT_KEY_PASSPHRASE }}"
          openssl pkey -in "$RAW_KEY_FILE" -passin env:SF_JWT_KEY_PASSPHRASE -out "$JWT_KEY_FILE"

          sf org login jwt \
            --client-id "${{ secrets.SF_CLIENT_ID }}" \
            --jwt-key-file "$JWT_KEY_FILE" \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias target-org \
            --set-default

          rm -f "$RAW_KEY_FILE" "$JWT_KEY_FILE"

      - name: Verify authentication and target org identity
        run: |
          set -euo pipefail
          ORG_INFO=$(sf org display --target-org target-org --json)
          ORG_ID=$(echo "$ORG_INFO" | jq -r '.result.id')
          echo "Authenticated to org: $ORG_ID"

          # Optional guardrail: if an environment defines SF_EXPECTED_ORG_ID,
          # refuse to continue on a mismatch, e.g. UAT credentials
          # accidentally saved under the Production GitHub Environment.
          if [ -n "${{ secrets.SF_EXPECTED_ORG_ID }}" ] && [ "$ORG_ID" != "${{ secrets.SF_EXPECTED_ORG_ID }}" ]; then
            echo "::error::Authenticated org ($ORG_ID) does not match SF_EXPECTED_ORG_ID configured for the '${{ needs.determine-environment.outputs.environment }}' environment. Refusing to continue - check for a secrets misconfiguration."
            exit 1
          fi

      - name: Generate delta package
        run: |
          set -euo pipefail
          BEFORE_SHA="${{ inputs.from_ref || github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          # On the branch's first push (or a manual dispatch with no
          # from_ref), github.event.before is empty/all-zeros - fall back
          # to diffing against the parent commit instead.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA=$(git rev-parse "$AFTER_SHA^" 2>/dev/null || echo "$AFTER_SHA")
          fi

          echo "Generating delta package between $BEFORE_SHA and $AFTER_SHA"
          mkdir -p delta

          sf sgd:source:delta \
            --to "$AFTER_SHA" \
            --from "$BEFORE_SHA" \
            --output-dir delta \
            --generate-delta

          echo "Generated package.xml:"
          cat delta/package/package.xml 2>/dev/null || echo "No package.xml generated"

          if [ ! -f "delta/package/package.xml" ] || ! grep -q "<members>" delta/package/package.xml; then
            echo "No metadata changes detected - nothing to deploy"
            echo "SKIP_DEPLOYMENT=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_DEPLOYMENT=false" >> "$GITHUB_ENV"
          fi

      # dev/qa: deploy directly with NoTestRun, no separate validate step.
      # `sf project deploy validate` (checkOnly) rejects NoTestRun outright -
      # Salesforce doesn't consider a dry-run with zero tests meaningful - so
      # the validate+quick-deploy two-step pattern can't be used here at all.
      # A direct one-step deploy is the only way to actually skip tests.
      - name: Deploy directly (dev/qa - tests skipped for fast iteration)
        id: direct_deploy_step
        if: env.SKIP_DEPLOYMENT == 'false' && (needs.determine-environment.outputs.test_level == 'NoTestRun')
        run: |
          set -euo pipefail
          echo "Deploying directly to '${{ needs.determine-environment.outputs.environment }}' with test level 'NoTestRun'"

          if ! DEPLOY_RESULT=$(sf project deploy start \
                --manifest delta/package/package.xml \
                --target-org target-org \
                --test-level NoTestRun \
                --wait 30 \
                --json); then
            echo "$DEPLOY_RESULT" | jq . 2>/dev/null || echo "$DEPLOY_RESULT"
            echo "::error::Deploy failed against '${{ needs.determine-environment.outputs.environment }}'"
            exit 1
          fi

          echo "$DEPLOY_RESULT" | jq -r '.result.id' | xargs -I{} echo "deploy_id={}" >> "$GITHUB_OUTPUT"

      # uat/production: validate first (RunLocalTests, mandatory - Salesforce
      # disallows NoTestRun for Production regardless of policy), then quick
      # deploy the exact package that was just validated.
      - name: Validate deployment (uat/production - tests required)
        id: validate_step
        if: env.SKIP_DEPLOYMENT == 'false' && (needs.determine-environment.outputs.test_level == 'RunLocalTests')
        run: |
          set -euo pipefail
          echo "Validating against '${{ needs.determine-environment.outputs.environment }}' with test level 'RunLocalTests' before deploying"

          if ! VALIDATION_RESULT=$(sf project deploy validate \
                --manifest delta/package/package.xml \
                --target-org target-org \
                --test-level RunLocalTests \
                --wait 30 \
                --json); then
            echo "$VALIDATION_RESULT" | jq . 2>/dev/null || echo "$VALIDATION_RESULT"
            echo "::error::Validation failed - aborting before any deploy is attempted"
            exit 1
          fi

          DEPLOY_ID=$(echo "$VALIDATION_RESULT" | jq -r '.result.id')
          echo "validation_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Validation ID: $DEPLOY_ID"

      - name: Deploy to target org (quick deploy of the already-validated package)
        if: env.SKIP_DEPLOYMENT == 'false' && steps.validate_step.outputs.validation_id
        run: |
          set -euo pipefail
          echo "Quick-deploying validated package ${{ steps.validate_step.outputs.validation_id }} to '${{ needs.determine-environment.outputs.environment }}'"

          sf project deploy quick \
            --job-id "${{ steps.validate_step.outputs.validation_id }}" \
            --target-org target-org \
            --wait 30

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "### Deploy summary"
            echo "- **Environment:** ${{ needs.determine-environment.outputs.environment }}"
            echo "- **Test level:** ${{ needs.determine-environment.outputs.test_level }}"
            echo "- **Branch:** ${{ github.ref_name }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Deploy ID:** ${{ steps.direct_deploy_step.outputs.deploy_id || steps.validate_step.outputs.validation_id || 'n/a (no changes deployed)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke Salesforce session and remove key material
        if: always()
        run: |
          sf org logout --target-org target-org --no-prompt || true
          # The auth step already removes its own key file (via trap and on
          # success); this is just a belt-and-braces sweep for anything left
          # behind by an interrupted run.
          rm -f "$RUNNER_TEMP"/jwt-key* 2>/dev/null || true
